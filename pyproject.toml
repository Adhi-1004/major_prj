[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-extractor"
version = "0.1.0"
description = "Find the exact frame where a dialogue is spoken on-screen in a video"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: real models, no network (deselect with '-m \"not slow\"')",
    "e2e: real network and/or credentials required (deselect by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored verbatim from NVIDIA-Maxine/nim-clients (see VENDORED.md). Kept
# byte-identical to upstream so it stays diffable when they change it, which
# means it is not ours to reformat.
extend-exclude = ["src/dialogue_extractor/vision/providers/nim/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF002 flag "ambiguous" unicode characters -- curly quotes, en dashes,
# non-breaking spaces. This module exists precisely to fold those into their
# ASCII equivalents, so it has to name them literally.
"src/dialogue_extractor/matching/text_normalizer.py" = ["RUF001", "RUF002"]
# Tests assert that curly and straight forms normalize identically, so they
# must contain both.
"tests/unit/matching/test_text_normalizer.py" = ["RUF001", "RUF002"]
# Table writers: header rows and LaTeX templates are clearer as one literal
# per line than wrapped across several.
"src/dialogue_extractor/eval/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/dialogue_extractor"]
ignore_missing_imports = true
exclude = ["src/dialogue_extractor/vision/providers/nim/"]

[[tool.mypy.overrides]]
module = "dialogue_extractor.vision.providers.nim.*"
ignore_errors = true

# The pure core carries the subtle logic, and the orchestrator and request
# schema are the two contract boundaries everything else is read through.
# Hold all of them to a stricter standard.
[[tool.mypy.overrides]]
module = [
    "dialogue_extractor.domain.*",
    "dialogue_extractor.interfaces.*",
    "dialogue_extractor.matching.*",
    "dialogue_extractor.pipeline.confidence",
    "dialogue_extractor.pipeline.orchestrator",
    "dialogue_extractor.api.schemas",
]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.coverage.run]
source = ["src/dialogue_extractor"]
branch = true
omit = ["src/dialogue_extractor/vision/providers/nim/*"]
