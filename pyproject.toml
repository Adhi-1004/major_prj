[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-extractor"
version = "0.1.0"
description = "Find the exact frame where a dialogue is spoken on-screen in a video"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: real models, no network (deselect with '-m \"not slow\"')",
    "e2e: real network and/or credentials required (deselect by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/dialogue_extractor"]
ignore_missing_imports = true

# The pure core carries the subtle logic; hold it to a stricter standard.
[[tool.mypy.overrides]]
module = [
    "dialogue_extractor.domain.*",
    "dialogue_extractor.interfaces.*",
    "dialogue_extractor.matching.*",
    "dialogue_extractor.pipeline.confidence",
]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.coverage.run]
source = ["src/dialogue_extractor"]
branch = true
